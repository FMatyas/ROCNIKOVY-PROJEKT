version: '3.8'

services:
  trackmyride:
    build: .
    container_name: trackmyride_app
    ports:
      - "8000:8000"
    environment:
      # --- API PRO VIN (eTechničák) ---
      - DATAOVOZIDLECH_API_KEY=UL48f06jWdtL6rlTEcVx9Mgehx8DoGY5

      # --- GOOGLE OAUTH PŘIHLÁŠENÍ ---
      # Získej v Google Cloud Console (https://console.cloud.google.com/apis/credentials)
      - GOOGLE_CLIENT_ID=tvuj_google_client_id.apps.googleusercontent.com
