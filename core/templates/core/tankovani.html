<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyRide - Nové tankování</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden animate-fade-in-up">
        
        <!-- Hlavička formuláře - Zelený design pro tankování/finance -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 p-8 text-center relative overflow-hidden">
            <!-- Dekorativní kruhy v pozadí pro lepší efekt -->
            <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
            <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-black opacity-10"></div>
            
            <div class="text-5xl mb-4 relative z-10">⛽</div>
            <h1 class="text-2xl font-bold text-white mb-1 relative z-10">Zápis tankování</h1>
            <p class="text-teal-100 text-sm relative z-10">Pro vozidlo: <strong class="text-white">{{ vehicle.name }}</strong></p>
        </div>

        <div class="p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <div class="space-y-4">
                    {{ form.as_p }}
                </div>

                <div class="pt-4 flex gap-4">
                    <a href="{% url 'dashboard' %}" class="w-1/3 text-center py-3 px-4 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium transition-colors duration-200">
                        Zrušit
                    </a>
                    <button type="submit" class="w-2/3 py-3 px-4 rounded-xl text-white font-bold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 shadow-lg hover:shadow-teal-500/30 transform hover:-translate-y-0.5 transition-all duration-200">
                        Zapsat výdaj 💸
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
