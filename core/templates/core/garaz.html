<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyRide - Přidat vozidlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Jemná animace pro zobrazení formuláře */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex items-center justify-center p-4">

    <!-- Hlavní kontejner s animací -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden animate-fade-in-up">
        
        <!-- Hlavička formuláře -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-center">
            <div class="text-5xl mb-4">🚗</div>
            <h1 class="text-2xl font-bold text-white mb-1">Nové vozidlo</h1>
            <p class="text-blue-100 text-sm">Zaparkuj další kousek do své virtuální garáže.</p>
        </div>

        <!-- Tělo formuláře -->
        <div class="p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <!-- Zde se vykreslí pole z Django forms.py (kterým jsme už nastavili třídy) -->
                <div class="space-y-4">
                    {{ form.as_p }}
                </div>

                <!-- Tlačítka -->
                <div class="pt-4 flex gap-4">
                    <a href="{% url 'dashboard' %}" class="w-1/3 text-center py-3 px-4 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium transition-colors duration-200">
                        Zpět
                    </a>
                    <button type="submit" class="w-2/3 py-3 px-4 rounded-xl text-white font-bold bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 transition-all duration-200">
                        Uložit auto ✨
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
